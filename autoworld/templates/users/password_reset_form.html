{% extends 'users/auth_base.html' %}

{% block content %}
<h1>{{ title }}</h1>
<p>Введите E-mail, указанный при регистрации. На него будет отправлена ссылка для смены пароля.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Отправить письмо</button>
</form>
{% endblock %}
