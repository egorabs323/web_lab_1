<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Авторизация{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'cars/css/styles.css' %}">
</head>
<body>
<div class="auth-container">
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
