{% extends 'users/auth_base.html' %}

{% block content %}
<h1>{{ title }}</h1>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить новый пароль</button>
    </form>
{% else %}
    <p>Ссылка восстановления недействительна или уже была использована.</p>
    <p><a href="{% url 'users:password_reset' %}">Запросить новую ссылку</a></p>
{% endif %}
{% endblock %}
