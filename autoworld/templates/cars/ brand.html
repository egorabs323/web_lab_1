{% extends 'base.html' %}

{% block content %}
<h2>{{ title }}</h2>
<p>Модели {{ brand.display }}:</p>
<ul>
    {% for m in models %}
        <li><a href="{% url 'cars:model' brand_slug=brand.name model_slug=m|lower %}">{{ m }}</a></li>
    {% endfor %}
</ul>
<p><a href="{% url 'cars:cars_list' %}">← Назад к списку марок</a></p>
{% endblock %}
